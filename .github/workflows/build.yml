name: Build GemPowers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GemPowers-plugin
          path: target/gempowers-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
